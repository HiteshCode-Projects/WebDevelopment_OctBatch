<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <select name="country">
        <option>India</option>
        <option>Russia</option>
        <option>Japan</option>
        <option disabled>Germany</option>
        <option selected disabled>Country</option>
        <option label="USA">United States of America</option>


    </select>


    <select name="menu">
        <option>Breakfast</option>
        <option>Lunch</option>
        <option>Dinner</option>
    </select>

    <select name="city" required>
        <option>Delhi</option>
        <option>Mumbai</option>
    </select>

     <select name="cities" disabled>
        <option>Delhi</option>
        <option>Mumbai</option>
    </select>

     <select name="citiess" multiple>
        <option>Delhi</option>
        <option>Mumbai</option>
        <option>Bangalore</option>
    </select>


</body>
</html>
