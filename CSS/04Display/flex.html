<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
                font-family: Arial, Helvetica, sans-serif;
                background-color: #f9f9f9;
                height: 100vh;

                display: flex;
                justify-content: center;
                gap: 25px;
                align-items: center;
                flex-wrap: wrap;


            }



        .product{
             border: 1px solid black;
             border-radius: 12px;
             margin-bottom: 15px;
             padding: 12px;

            width: 250px;
            text-align: center;

            /* box-shadow: Xaxis Yaxis Spread -radius color; */
            box-shadow:    4px    4px     8px         black;
        }

    .product  img{
              width: 100%;
              height: 160px;
              object-fit: cover;  
              border-radius: 12px;
        }


        .product:hover{
            background-color: orangered;
            color: white;
            transition: 5s;
        }

        .product button{
            background-color: orange;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 12px;
            width: 90%;
        }
    </style>
</head>
<body>
    <div class="product">
         <img alt="headphone" src="https://images.pexels.com/photos/210927/pexels-photo-210927.jpeg">
         <h2>Headphone</h2>
         <p>Rs 2,499</p>
         <button>Buy NoW</button>
    </div>

     <div class="product">
         <img src="https://images.pexels.com/photos/33797585/pexels-photo-33797585.jpeg">
         <h2>Mobile</h2>
         <p>Rs 26,499</p>
         <button>Buy NoW</button>
    </div>


     <div class="product">
         <img src="https://images.pexels.com/photos/6961151/pexels-photo-6961151.jpeg">
         <h2>Shoes</h2>
         <p>Rs 1,499</p>
         <button>Buy NoW</button>
    </div>




</body>
</html>
