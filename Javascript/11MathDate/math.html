<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        //Math Object 

        console.log( Math.PI )

        console.log(Math.SQRT2)

        console.log(Math.sqrt(25))

        console.log(Math.pow(2,4))

        console.log(Math.random())  //By Default Between 0 - 1

        // .floor means Remove The Decimanl No(part)
        console.log(Math.floor(8.9))  //8

        // .ceil - Convert into Next Whole Number
        console.log(Math.ceil(5.1))  //6

        //. round()  Base Number > .5 < Next Whole number
        console.log(Math.round(4.3))  //4

        console.log(Math.round(4.5)) // = .5 ->Next Whole Number - 5


        console.log(Math.round(4.7)) // 5
 

    </script>
</body>
</html>
