<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        //Callback Hell 

        function first(status,callback){

               console.log(`Order Confirmed ${status}`)

               callback("Pizza",function(callback){
                console.log("Out of Delivery")

                callback()
               } )

        }

        first("OrderId123" , function(status2,callback){
            console.log(`Preparing Food Items ${status2}`)

            callback(function(){
                console.log("Delivered")
            })

        })
    </script>
</body>
</html>
