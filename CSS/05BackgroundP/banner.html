<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .banner{
            border: 1px solid black;
            height: 650px;


            background-color: bisque;
            /* background-image: url('Link/Name of Img-downloaded'); */
            background-image: url('https://images.pexels.com/photos/31593645/pexels-photo-31593645.jpeg');
            background-position: center;
            background-size: cover;
            background-repeat: no-repeat;

            display: flex;
            justify-content: center;
            align-items: center;

            /* filter: blur(2px); */
            filter: brightness(20%);
        }

        h1{
            color: white;
            font-size: 80px;
            letter-spacing: 10px;
            text-shadow: 0 4px 2px blue;
         
        }
    </style>
</head>
<body>
<div class="banner">
    <h1>Netflix</h1>
</div>
</body>
</html>
