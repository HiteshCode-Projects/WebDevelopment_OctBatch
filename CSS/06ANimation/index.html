<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            width: 100px;
            height: 100px;
            background-color: red;
            animation-name: ChangeColor;
            animation-duration: 5s;
            animation-iteration-count: infinite;

        }

        /* @keyframes Animation-Name - Help us To Add Amination */

        /* @keyframes ChangeColor{

            from {background-color: red;}

            to   {background-color: blue;}

        } */

          /* @keyframes ChangeColor{

          0% {background-color: red;}

          25% {background-color: blue;}

          50% {background-color: yellow;}

          75% {background-color: pink;}

          100% {background-color: brown;}

        } */


           @keyframes ChangeColor{

          0% {background-color: red; transform: translateX(0); }

          

          50% {background-color: yellow; transform: translateY(200px); border-radius: 50%; opacity: 0.5;}

        

          100% {background-color: brown; transform: translateX(0);}

        }



    </style>
</head>
<body>
    <div class="box">
        
    </div>

    <strong>Animation Effect Goes Back To Original form After Completing</strong>
</body>
</html>
