        //1. Find The Second Largest Unique Number Without Sorting of Array

        // Input :  [45,80,90,65,90,70]  //length 6 , Last index : length - 1
        // Output : 80

        //Solution 
       function secondLargest(arr){
        
        let largest = -Infinity 
        let seconDLargest = -Infinity


        //Travel Inside Array
        for(let i =0; i < arr.length ; i++){


             if(arr[i] > largest){
              
               seconDLargest = largest 
                        
               largest = arr[i]

             }else if( arr[i] > seconDLargest && arr[i] < largest){
                   seconDLargest = arr[i]
             }

        }


        return seconDLargest === -Infinity ? null : seconDLargest;

       }


    console.log(secondLargest([45,80,90,65,90,70]))     




    //2 . Remove Duplicate Value from an Array

    // Input : [101,102,103,101,104,102]

    // Ouput ;[101,102,103,104]


    function removeDuplicate(arr){
            
        let result = [];

        for(let j = 0; j < arr.length; j++){

                if(!result.includes(arr[j])){
                    result.push(arr[j])
                }
        }


        return result;


    }



    console.log(removeDuplicate([101,102,103,101,104,102,104]))






    //3 . Count the Frequency of Each Character

    function countChatcter(str){


        let frequency = {}


        for(let k = 0; k < str.length ; k++){

           let char =   str[k]

           if(frequency[char]){
                  frequency[char]++

           }else{

            frequency[char] = 1
           }
        }


        return frequency

    }

        //4. Reverse String
        //Input = "hello"
        
        //Output = "olleh"


        function reverseString(str){

            let reversed = ""

            for(let l = str.length - 1; l >= 0 ; l--){

                reversed += str[l]
            }

            return reversed
        }


        //5. Find Missing Numbers in an Array
        // Input ; [1,2,3,5,6]  //sum - 17  and [1,2,3,4,5,6] - TotalSum: 21 . 21 - 17 : 4
        //Output : 4

        function findMissing(arr,n){
            let expectedSum = n * (n+1)/2;

            let actualSum = 0

            for(let p =0; p < arr.length; p++){
                   actualSum +=  arr[p]
            }

            return expectedSum - actualSum


        }
        console.log(findMissing[1,2,3,5,6],6)



        //6. Check String is Palindrome 
        // Input madam , output : madam - Palindrome

        //TWO POINTER : left and right

        function isPalindrome(str){
            let left = 0
            let right = str.length - 1

            while(left < right){

                if(str[left] !== str[right]){
                    return false
                }

                left++
                right--

            }
            return true
        }
        console.log(isPalindrome("madam"))

       function findMaxium(arr){

             let max = arr[0]

             for(let q = 1; q < q.length; q++){

                if(arr[q] > max){

                }

             }
