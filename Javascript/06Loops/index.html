<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
    // Loop - Doing the same task again and again
    //GOLDEN RULE - WHen Condition is True loop Starts and When condition is False Loop stops
    
    //Print 1 to 10
    ///  console.log(1)
    ///  console.log(2) ..... 10 times


    //1. for(start point;end/conditon; Operation ++ / -- ) - When you know start and End Point use for loop
    
    //Print Number 1 to 10
    for( let i = 1; i <= 10;  i++  ){
        //Task 
          console.log(" The Value of Number " , i)
    }

    //Print 10 to 1
     for( let j=10 ; j >=1 ;  j--  ){
        //Task 
          console.log(" The Value of Number " , j)
    }
    

    //2. while(condition){
            
    //}


    let count = 1

    while(count<=5){
           console.log("Login Attempt")
           count++
    }


    //3 . do{Task}while(condition)
    // It will ALways execute / run or do the task Atleast for 1 time

    let number = 7

    do{
       console.log("Good Morning")
    }while(number<5)


    //4  break - To Stop

    for(let k=1; k<=5;k++){

           if(k == 3){
            break
           }

        console.log("Hello Guys")

    }


    //5. continue
     for(let p=5; p<=10;p++){

           if(p == 7){
            continue
           }

        console.log("Finding Items ", p)

    }




    
    
    
    
    </script>   
</body>
</html>
