<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
         .box{
            background-color: skyblue;
            width: 300px;
            height: 150px;
            text-align: center;

            /* border: 1px solid black; */

            /* border: 1px dashed black; */

         }


         p{
          border-bottom: 2px double blue;
          padding-bottom: 10px;
         }
    </style>
</head>
<body>

    <div class="box">
        <p>Helo Guys</p>
    </div>


    <div class="box">
        <p>Books</p>
    </div>
