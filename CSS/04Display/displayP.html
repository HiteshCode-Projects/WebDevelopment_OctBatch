<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        p{
            color: red;
        }

        #mpy{
            display: none;
        }

        #ex1{
            background-color: aqua;
            display: inline;
        }

        #ex2{
            background-color: blue;
            display: block;
        }
    </style>
</head>
<body>
    <p id="mpy">Hello Big Billoin Day Sale is LIVE!!!!!</p>


    <div>
        This is an Example of INline Display - Span Tag
        <p id="ex1">Hello Inline</p>
    </div>


      <div>
        This is an Example of Block Display - - Div Tag
        <p id="ex2">Hello Block</p>
    </div>
</body>
</html>
