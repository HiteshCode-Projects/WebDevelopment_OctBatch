<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let name = "John"
        let age = 21

        console.log("Good Morning My Name is " + name + "and I am " + age + "yrs old" )


        //Modern Way - Template ` Back Tick :  ${VariableName/Parameter}  `

        console.log(`
        Dear ${name},
        How are you doing , are you ${age} yrs old? 
        
        `)


        //Spread Operator :  ... 3 dots(symbol) - Make a clone/duplicate

        let fruits = ["Mango" , "apple"]
        let veggies = ["Tomato" , "Carrot"]

        let shoppingItems = [...veggies ,"Milk " , "Bread" , ...fruits     ]
        console.log(shoppingItems)


        //Syntax setTimeout(function(){

        // },time) 1000-1sec


        setTimeout(function(){
            console.log("Hii Guys How are you")
        },4000)

        setTimeout(()=>{
            console.log("Payment Successfull")
        },3000)


        setInterval(()=>{
                console.log("Running After every 2 sec of break")
        },2000)


    </script>
</body>
</html>
